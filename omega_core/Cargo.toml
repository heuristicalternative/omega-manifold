[package]
name = "omega_core"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "25.0" }
anyhow = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
